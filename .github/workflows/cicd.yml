# ==========================================================================
# QuantumWealth CI
#
# Jobs
#   1. code_quality        - Python (autoflake, black) and Prettier formatting gate
#   2. backend_test_build  - Django backend: Pytest with coverage, then Docker
#                            image build and container smoke test
#   3. ai_models_test      - AI models: compile and import check, then Pytest with
#                            coverage
#   4. frontend_test_build - Frontend: lint and Vitest with coverage, then
#                            production build
#
# Every job waits for code_quality, so formatting problems fail the run before
# any heavy dependencies are installed.
# ==========================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned so a new Black release cannot change formatting under our feet.
      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      # Check-only: nothing is rewritten. Covers the backend and AI models.
      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The Solidity plugin lets the same glob below also cover .sol files.
      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      # One Prettier pass over the whole repository (JS/JSX, JSON, HTML, CSS,
      # Markdown, Solidity and YAML, including this workflow).
      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # =======================================================================
  # Job 2 -- Backend Test & Build (Pytest + Docker image + smoke test)
  # =======================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      BACKEND_DIR: code/backend
      IMAGE_NAME: quantumwealth-backend
      CONTAINER_NAME: quantumwealth-backend-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      # The test tooling is installed separately from the application requirements.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      # --strict-markers fails the run if a test uses an unregistered marker.
      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      # Uploaded even when tests fail, so coverage is available for debugging.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      # Buildx enables the GitHub Actions layer cache used by the build step.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # push: false + load: true builds the image locally for the smoke test
      # without publishing it.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          # Context is code/ because the backend imports the sibling ai_models package
          context: code
          file: code/backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails the job if the image would run as root.
      - name: Verify image runs as a non-root user
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id "${IMAGE_NAME}:ci" -u)
          echo "Container user id: ${uid}"
          if [ "${uid}" = "0" ]; then
            echo "Image must not run as root." >&2
            exit 1
          fi

      - name: Smoke test the built image
        # Starts the image with its default CMD (gunicorn). Production settings
        # redirect plain HTTP to HTTPS, so the request carries X-Forwarded-Proto
        # to mimic a TLS proxy.
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CONTAINER_NAME}" \
            -p 8000:8000 \
            -e SECRET_KEY=ci-smoke-test-secret-key-that-is-at-least-fifty-characters-long \
            "${IMAGE_NAME}:ci"

          echo "=== Waiting for backend to respond ==="
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/api/schema/ -o response.txt; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Backend did not become ready in time." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

          echo "=== Response ==="
          head -c 600 response.txt
          echo
          grep -q '^openapi:' response.txt || {
            echo "Schema endpoint did not return an OpenAPI document." >&2
            docker logs "${CONTAINER_NAME}"
            exit 1
          }

      # Only runs when an earlier step failed, to make the failure diagnosable.
      - name: Show container logs on failure
        if: failure()
        run: docker logs "${CONTAINER_NAME}" || true

      # Always clean up, even when the smoke test fails.
      - name: Stop container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}" || true

  # ============================================================
  # Job 3 -- AI Models Test & Validation (Pytest + coverage)
  # ============================================================
  ai_models_test:
    name: AI Models Test & Validation
    runs-on: ubuntu-latest
    needs: code_quality
    timeout-minutes: 45

    env:
      AI_MODELS_DIR: code/ai_models
      # ai_models is imported as a top-level package, so code/ must be on the path.
      PYTHONPATH: ${{ github.workspace }}/code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/ai_models/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r "${AI_MODELS_DIR}/requirements.txt"
          python -m pip install pytest pytest-cov

      # Cheap syntax check that also covers files the tests never import.
      - name: Byte-compile all ai_models sources
        run: |
          set -euo pipefail
          echo "=== Compiling optimizer, risk, robo-advisor, predictor, backtester and tests ==="
          python -m compileall -q "${AI_MODELS_DIR}"

      # Catches missing dependencies and broken imports before the tests run.
      - name: Verify public API and sub-packages import cleanly
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib

          for package in (
              "anomaly_detector",
              "backtester",
              "factor_models",
              "market_predictor",
              "portfolio_optimizer",
              "risk_engine",
              "robo_advisor",
              "sentiment_analyzer",
              "tax_optimizer",
          ):
              module = importlib.import_module(f"ai_models.{package}")
              for name in module.__all__:
                  getattr(module, name)
              print(f"OK   ai_models.{package} ({len(module.__all__)} exports)")
          print("ai_models imports cleanly")
          PY

      # Tests use synthetic data and patch yfinance, so no network is needed.
      - name: Run ai_models test suite
        working-directory: ${{ env.AI_MODELS_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --cov=ai_models \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      # Uploaded even when tests fail, so coverage is available for debugging.
      - name: Upload ai_models coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-models-coverage-report
          path: code/ai_models/coverage.xml
          if-no-files-found: ignore
          retention-days: 30

  # =============================================================================
  # Job 4 -- Frontend Test & Build (Lint + Vitest + coverage + production build)
  # =============================================================================
  frontend_test_build:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json pins;
      # --legacy-peer-deps tolerates peer dependency conflicts in the tree.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        run: npm run lint

      # Vitest suite (jsdom): the API client with token refresh, the auth hook,
      # shared UI components, the layout, the sign in and registration pages, and
      # app routing. Runs before the build so test failures show up first.
      - name: Run frontend test suite
        run: npm run test:coverage

      # Uploaded even when tests fail, so coverage is available for debugging.
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 30

      # Vite production build; the bundle lands in frontend/dist.
      - name: Build frontend
        run: CI=false npm run build

      # Keeps the production bundle for a week so it can be inspected.
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
